# ==========================================================
#  APPLICATION PROPERTIES
#  (src/main/resources/application.properties)
# ==========================================================

# Name of the application (shown in logs)
spring.application.name=payroll-management

# The web server runs at http://localhost:8080
server.port=8080

# We are NOT using a database in this version - data is kept in Java collections
# (ArrayList, HashMap and TreeMap) while the application runs.

# Reload the HTML pages automatically when a template file is changed
spring.thymeleaf.cache=false

# Show the real error message on error pages (helpful while developing)
server.error.include-message=always

# Hide the "whitelabel" style error page details from the browser title
server.error.include-binding-errors=always